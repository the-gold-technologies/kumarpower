<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="100%" height="100%">
  <rect width="320" height="120" rx="8" fill="#ffffff" />
  <g transform="translate(15, 15)">
    <!-- Gear icon representing industry -->
    <g transform="translate(45, 45)">
      <circle cx="0" cy="0" r="32" fill="#0E4B75" />
      <circle cx="0" cy="0" r="22" fill="#ffffff" />
      <circle cx="0" cy="0" r="14" fill="#E65100" />
      <circle cx="0" cy="0" r="6" fill="#ffffff" />
      <!-- Gear teeth -->
      <rect x="-4" y="-36" width="8" height="8" fill="#0E4B75" rx="1" />
      <rect x="-4" y="28" width="8" height="8" fill="#0E4B75" rx="1" />
      <rect x="-36" y="-4" width="8" height="8" fill="#0E4B75" rx="1" />
      <rect x="28" y="-4" width="8" height="8" fill="#0E4B75" rx="1" />
      <rect x="-26" y="-26" width="8" height="8" fill="#0E4B75" rx="1" transform="rotate(45)" />
      <rect x="18" y="-26" width="8" height="8" fill="#0E4B75" rx="1" transform="rotate(45)" />
